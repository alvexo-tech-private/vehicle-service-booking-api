databaseChangeLog:
  - changeSet:
      id: 055-seed-test-mechanic
      author: system
      context: dev
      runOnChange: false
      comment: >
        Static, pre-verified MECHANIC test account for manual/QA testing.
        Logs in via /api/auth/login (email or mobile + PIN) with no OTP/SMS
        step needed. Credentials: test.mechanic@alvexotech.com / 9000000002 / PIN 1234.

      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users WHERE email = 'test.mechanic@alvexotech.com'

      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: Test

              - column:
                  name: last_name
                  value: Mechanic

              - column:
                  name: password
                  value: $2a$10$KbK9ZdAoPKohKj2pRo65XupdhDymVLUE5oQzQ4Nc2ZEp7QAqHFURC

              - column:
                  name: role
                  value: MECHANIC

              - column:
                  name: email
                  value: test.mechanic@alvexotech.com

              - column:
                  name: mobile_number
                  value: 9000000002

              - column:
                  name: city
                  value: Chennai

              - column:
                  name: workshop_name
                  value: Test Workshop

              - column:
                  name: active
                  valueBoolean: true

              - column:
                  name: email_verified
                  valueBoolean: true

              - column:
                  name: mobile_verified
                  valueBoolean: true

              - column:
                  name: created_at
                  valueDate: NOW()

              - column:
                  name: updated_at
                  valueDate: NOW()
