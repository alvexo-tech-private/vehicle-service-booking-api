databaseChangeLog:
  - changeSet:
      id: 032-create-workshop-payment-setups-table
      author: system
      comment: Payment Setup (Menu 11) — payment-partner-agnostic payout config, one per workshop.
      changes:
        - createTable:
            tableName: workshop_payment_setups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: eligibility
                  type: VARCHAR(20)
                  defaultValue: NOT_ELIGIBLE
                  constraints:
                    nullable: false
              - column:
                  name: partner
                  type: VARCHAR(50)
              - column:
                  name: account_ref
                  type: VARCHAR(100)
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_payment_setups
            baseColumnNames: mechanic_id
            constraintName: fk_wps_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: workshop_payment_setups
