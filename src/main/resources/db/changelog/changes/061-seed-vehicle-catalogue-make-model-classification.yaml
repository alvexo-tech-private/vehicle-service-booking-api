databaseChangeLog:
  - changeSet:
      id: 061-seed-vehicle-catalogue-make-model-classification
      author: system
      context: dev
      runOnChange: false
      comment: >
        Adds the full make/model set from the official "Make & Model Classification"
        sheet (Petrol + Electric, Bikes + Scooters per make) that 022-seed-vehicle-catalogue.yaml
        didn't already cover (a handful of makes/models — e.g. Honda Dio, Hero Glamour —
        were already seeded there and are skipped here to avoid duplicate catalogue rows),
        and introduces vehicle_type = SCOOTER so scooters are no longer miscategorized as
        MOTORCYCLE. Purely additive — doesn't touch or remove any existing catalogue row,
        so no previously-registered rider vehicle is affected.
      changes:

        # ── PETROL — Hero (Bikes) ────────────────────────────────────────
        - insert:
            tableName: vehicles
            columns:
              - column: { name: make,         value: "Hero" }
              - column: { name: model,        value: "HF 100" }
              - column: { name: year,         valueNumeric: 2024 }
              - column: { name: vehicle_type, value: "MOTORCYCLE" }
              - column: { name: fuel_type,    value: "PETROL" }
              - column: { name: active,       valueBoolean: true }
              - column: { name: created_by,   valueComputed: "(SELECT id FROM users WHERE role = 'ADMINISTRATOR' LIMIT 1)" }
              - column: { name: created_at,   valueComputed: "NOW()" }
              - column: { name: updated_at,   valueComputed: "NOW()" }
