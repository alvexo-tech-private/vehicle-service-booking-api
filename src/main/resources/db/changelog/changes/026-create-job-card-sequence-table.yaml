databaseChangeLog:
  - changeSet:
      id: 026-create-job-card-sequence-table
      author: system
      comment: >
        Creates job_card_sequence table for concurrency-safe job card numbering.
        Each row tracks the last sequence number used for a mechanic on a date.
        Usage: SELECT FOR UPDATE to acquire a row-level lock, then increment
        last_sequence atomically. Guarantees gap-free sequential numbering
        without retries under concurrent booking confirmations.
      changes:
        - createTable:
            tableName: job_card_sequence
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: mechanic_settings_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: sequence_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: last_sequence
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: job_card_sequence
            baseColumnNames: mechanic_settings_id
            constraintName: fk_job_card_seq_settings
            referencedTableName: mechanic_settings
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

        - addUniqueConstraint:
            tableName: job_card_sequence
            columnNames: mechanic_settings_id, sequence_date
            constraintName: uq_job_card_seq_mechanic_date

        - createIndex:
            indexName: idx_job_card_seq_lookup
            tableName: job_card_sequence
            columns:
              - column:
                  name: mechanic_settings_id
              - column:
                  name: sequence_date

      rollback:
        - dropTable:
            tableName: job_card_sequence
