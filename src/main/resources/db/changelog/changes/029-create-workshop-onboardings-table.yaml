databaseChangeLog:
  - changeSet:
      id: 029-create-workshop-onboardings-table
      author: system
      comment: Submit Onboarding (Menu 7) — fee, submission, and admin decision, one per workshop.
      changes:
        - createTable:
            tableName: workshop_onboardings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: fee_amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: fee_paid
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: payment_ref
                  type: VARCHAR(100)
              - column:
                  name: reference_id
                  type: VARCHAR(30)
                  constraints:
                    unique: true
              - column:
                  name: submitted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMP
              - column:
                  name: decision
                  type: VARCHAR(20)
              - column:
                  name: decision_reason
                  type: TEXT
              - column:
                  name: decided_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_onboardings
            baseColumnNames: mechanic_id
            constraintName: fk_workshop_onboardings_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: workshop_onboardings
