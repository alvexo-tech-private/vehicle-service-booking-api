databaseChangeLog:
  - changeSet:
      id: 060-create-workshop-code-seq
      author: system
      comment: >
        Canonical Booking ID series (MASTER_BACKEND_MVP_INTEGRATION_SPEC.md v3 §4.11/§6) —
        global sequence handing out each workshop's permanent 4-digit code, starting at 1888
        to match the spec's worked examples (e.g. "1888 TN 0881").
      changes:
        - sql:
            sql: CREATE SEQUENCE IF NOT EXISTS workshop_code_seq START WITH 1888 INCREMENT BY 1;
      rollback:
        - sql:
            sql: DROP SEQUENCE IF EXISTS workshop_code_seq;
  - changeSet:
      id: 060-create-workshop-booking-sequences-table
      author: system
      comment: >
        One row per workshop: its permanently-assigned workshop code, its vehicle-registration
        state code, and an atomically-incrementing per-workshop sequence. bookingNumber is built
        as "{workshopCode} {stateCode} {sequence, 4-digit zero-padded}" (MASTER_BACKEND_MVP_INTEGRATION_SPEC.md
        v3 §4.11) — replaces the previous random "BKG<timestamp><random>" format.
      changes:
        - createTable:
            tableName: workshop_booking_sequences
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: workshop_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: state_code
                  type: VARCHAR(5)
                  constraints:
                    nullable: false
              - column:
                  name: current_sequence
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_booking_sequences
            baseColumnNames: mechanic_id
            constraintName: fk_workshop_booking_sequences_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: workshop_booking_sequences
