databaseChangeLog:
  - changeSet:
      id: 026-create-workshop-images-table
      author: system
      comment: Workshop Images (Menu 5) — shopfront/interior/signage photos, many per workshop.
      changes:
        - createTable:
            tableName: workshop_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: file_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_images
            baseColumnNames: mechanic_id
            constraintName: fk_workshop_images_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: workshop_images
            baseColumnNames: file_id
            constraintName: fk_workshop_images_file
            referencedTableName: stored_files
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            indexName: idx_workshop_images_mechanic
            tableName: workshop_images
            columns:
              - column:
                  name: mechanic_id
      rollback:
        - dropTable:
            tableName: workshop_images
