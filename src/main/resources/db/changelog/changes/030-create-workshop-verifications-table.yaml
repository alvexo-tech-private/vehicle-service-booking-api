databaseChangeLog:
  - changeSet:
      id: 030-create-workshop-verifications-table
      author: system
      comment: Platform Verified (Menu 8) — completed verification methods, one per workshop.
      changes:
        - createTable:
            tableName: workshop_verifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: verified_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_verifications
            baseColumnNames: mechanic_id
            constraintName: fk_workshop_verifications_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - createTable:
            tableName: workshop_verification_methods
            columns:
              - column:
                  name: workshop_verification_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: method
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_verification_methods
            baseColumnNames: workshop_verification_id
            constraintName: fk_wvm_verification
            referencedTableName: workshop_verifications
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: workshop_verification_methods
        - dropTable:
            tableName: workshop_verifications
