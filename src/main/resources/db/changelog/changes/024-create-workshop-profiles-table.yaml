databaseChangeLog:
  - changeSet:
      id: 024-create-workshop-profiles-table
      author: system
      comment: >
        Cross-cutting workshop status: overall onboarding/verification status plus
        suspension flag/reason, read by "Current Status" and "Operational Trust".
      changes:
        - createTable:
            tableName: workshop_profiles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: NEW_TO_APP
                  constraints:
                    nullable: false
              - column:
                  name: suspended
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: suspension_reason
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workshop_profiles
            baseColumnNames: mechanic_id
            constraintName: fk_workshop_profiles_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
      rollback:
        - dropTable:
            tableName: workshop_profiles
