databaseChangeLog:
  - changeSet:
      id: 040-create-settlements-table
      author: system
      comment: >
        Workshop Finance & Settlement tab (WORKSHOP_FINANCE_API_SPEC.md §2/§3).
        One row per (mechanic, settlementDate); payment-transaction columns are
        only populated once status = PAID.
      changes:
        - createTable:
            tableName: settlements
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: settlement_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: net_pay
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: service_reliability_adjustment
                  type: DECIMAL(10,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: settlement_released
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: transaction_number
                  type: VARCHAR(50)
              - column:
                  name: payment_gateway
                  type: VARCHAR(50)
              - column:
                  name: payment_gateway_reference
                  type: VARCHAR(100)
              - column:
                  name: payment_date
                  type: DATE
              - column:
                  name: payment_time
                  type: TIME
              - column:
                  name: payment_status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: settlements
            columnNames: mechanic_id, settlement_date
            constraintName: uq_settlement_mechanic_date
        - addForeignKeyConstraint:
            baseTableName: settlements
            baseColumnNames: mechanic_id
            constraintName: fk_settlements_mechanic
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            tableName: settlements
            indexName: idx_settlements_mechanic_date
            columns:
              - column:
                  name: mechanic_id
              - column:
                  name: settlement_date
      rollback:
        - dropTable:
            tableName: settlements

  - changeSet:
      id: 040-create-settlement-queries-table
      author: system
      comment: >
        Raise Settlement Query (WORKSHOP_FINANCE_API_SPEC.md §6).
      changes:
        - createTable:
            tableName: settlement_queries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mechanic_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: settlement_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: OPEN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: settlement_queries
            baseColumnNames: mechanic_id
            constraintName: fk_settlement_queries_mechanic
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: settlement_queries
            baseColumnNames: settlement_id
            constraintName: fk_settlement_queries_settlement
            referencedTableName: settlements
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            tableName: settlement_queries
            indexName: idx_settlement_queries_mechanic
            columns:
              - column:
                  name: mechanic_id
      rollback:
        - dropTable:
            tableName: settlement_queries
